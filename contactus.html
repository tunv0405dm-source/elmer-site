<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liên hệ – Elmer</title>
<style>
body{margin:0;font-family:'Segoe UI',Roboto,Arial,sans-serif;color:#2A2113;background:#FDF1CC;line-height:1.6}
main{max-width:520px;margin:0 auto;padding:48px 24px}
h1{font-size:1.8rem;margin:0 0 8px}
p{color:#6B5F4B}
label{display:block;margin-top:16px;font-weight:700}
input,textarea{width:100%;box-sizing:border-box;padding:12px;border:1.5px solid #F1DDB4;border-radius:10px;font:inherit;background:#fff}
button{margin-top:24px;width:100%;min-height:52px;border:0;border-radius:12px;background:#FFA940;color:#2A2113;font-weight:800;font-size:1.05rem;cursor:pointer}
button:hover{background:#FF9A1F}
a{color:#B96D00}
</style>
</head>
<body>
<main>
  <h1>Liên hệ đặt license</h1>
  <p>Để lại thông tin, đội ngũ Elmer sẽ liên hệ tư vấn và báo hợp đồng.</p>
  <!-- Thay YOUR_FORM_ID bằng ID form của bạn tại https://formspree.io -->
  <form action="https://formspree.io/f/xnpjbkkp" method="POST">
    <label for="name">Họ và tên</label>
    <input id="name" name="name" required>
    <label for="phone">Số điện thoại</label>
    <input id="phone" name="phone" type="tel" required>
    <label for="email">Email</label>
    <input id="email" name="email" type="email">
    <label for="msg">Số lượng tủ / nhu cầu</label>
    <textarea id="msg" name="message" rows="4"></textarea>
    <button type="submit">Gửi thông tin</button>
  </form>
  <p><a href="/">← Về trang chủ</a></p>
</main>
</body>
</html>
